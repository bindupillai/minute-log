<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Minute Log">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Minute Log</title>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>Minute Log</h1>
        <p id="today"></p>
      </div>
      <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙️</button>
    </header>

    <section class="clock-card">
      <div class="time" id="currentTime">--:--</div>
      <div class="hint">What are you doing right now?</div>
    </section>

    <section class="quick-add">
      <h2>Tap once to log</h2>
      <div id="activityButtons" class="activity-grid"></div>
      <button id="moreBtn" class="secondary">＋ More activities</button>
    </section>

    <section class="log-section">
      <div class="section-title">
        <h2>Today's timeline</h2>
        <button id="clearBtn" class="text-btn">Clear</button>
      </div>
      <div id="timeline" class="timeline"></div>
    </section>
  </main>

  <dialog id="activityDialog">
    <form method="dialog" id="activityForm">
      <h2>Add activity</h2>
      <label>
        Activity name
        <input id="activityInput" maxlength="30" placeholder="e.g. Reading" autocomplete="off">
      </label>
      <div class="dialog-actions">
        <button value="cancel" class="secondary">Cancel</button>
        <button value="save" class="primary">Add & Log</button>
      </div>
    </form>
  </dialog>

  <dialog id="settingsDialog">
    <form method="dialog">
      <h2>Settings</h2>
      <p class="small">Your entries are stored on this device in your browser. Nothing is sent to a server.</p>
      <button value="close" class="primary full">Done</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
