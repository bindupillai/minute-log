<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>Minute Log</title></head><body><main><header><div><h1>Minute Log</h1><p id="today"></p></div><button id="settings">⚙️</button></header><section class="clock"><div id="now">--:--</div><small>Tap an activity to log it now</small></section><h2>Log now</h2><div id="buttons" class="grid"></div><button id="backlog">🕐 Add an earlier activity</button><button id="newActivity">＋ Add a new activity</button><section><div class="title"><h2>Today's timeline</h2><button id="clear">Clear</button></div><div id="timeline"></div></section></main><dialog id="backlogDialog"><form method="dialog" id="backlogForm"><h2>Add earlier activity</h2><p>Choose when the activity happened.</p><label>Date<input id="date" type="date" required></label><label>Time<input id="time" type="time" required></label><label>Activity<select id="activity"></select></label><div class="actions"><button value="cancel">Cancel</button><button value="save" class="primary">Add Activity</button></div></form></dialog><dialog id="newDialog"><form method="dialog" id="newForm"><h2>Add activity</h2><input id="name" maxlength="30" placeholder="e.g. Walking" required><div class="actions"><button value="cancel">Cancel</button><button value="save" class="primary">Add & Log Now</button></div></form></dialog><script src="app.js"></script></body></html>
